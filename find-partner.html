
  <style>
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 14px;
    }

    label {
      font-size: 14px;
      cursor: pointer;
    }

    #data-list {
      list-style: none;
      padding: 0;
    }

    #data-list li {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
    }

    .no-results {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<h1>Filterable Data</h1>

<div class="filters">

  <div id="orgFilter" class="filters"></div>
  <div id="audienceFilter" class="filters"></div>
  <div id="typeFilter" class="filters"></div>
  <div id="durationFilter" class="filters"></div>

  <ul id="data-list"></ul>
</div>

<script>
  let data = [];
  const list = document.getElementById("data-list");

  // Load JSON from GitHub RAW
  fetch("https://raw.githubusercontent.com/tobiattada/ieta/9ce47413125dbf23d976f8503633f7e6b9c0fbee/trip-platform-org-list.json")
    .then(res => res.json())
    .then(json => {
      data = json;

      createCheckboxes("orgFilter", data.map(i => i["Organization Name"]));
      createCheckboxes("audienceFilter", getAllValues("Program Audience"));
      createCheckboxes("typeFilter", getAllValues("Program Type"));
      createCheckboxes("durationFilter", getAllValues("Program Duration"));

      renderData(data);
    })
    .catch(err => console.error("JSON load error:", err));

  function getAllValues(prefix) {
    const values = [];

    data.forEach(item => {
      Object.keys(item).forEach(key => {
        if (key.startsWith(prefix) && item[key]) {
          values.push(item[key]);
        }
      });
    });

    return [...new Set(values)].sort();
  }

  function createCheckboxes(containerId, values) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    [...new Set(values)].sort().forEach(value => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${value}"> ${value}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });
  }

  function getCheckedValues(containerId) {
    return [...document.querySelectorAll(`#${containerId} input:checked`)]
      .map(i => i.value);
  }

  function matchesMultiColumn(item, prefix, selectedValues) {
    return selectedValues.some(val =>
      Object.keys(item).some(key =>
        key.startsWith(prefix) && item[key] === val
      )
    );
  }

  function applyFilters() {
    const orgs = getCheckedValues("orgFilter");
    const audiences = getCheckedValues("audienceFilter");
    const types = getCheckedValues("typeFilter");
    const durations = getCheckedValues("durationFilter");

    const filtered = data.filter(item => {
      if (orgs.length && !orgs.includes(item["Organization Name"])) return false;
      if (audiences.length && !matchesMultiColumn(item, "Program Audience", audiences)) return false;
      if (types.length && !matchesMultiColumn(item, "Program Type", types)) return false;
      if (durations.length && !matchesMultiColumn(item, "Program Duration", durations)) return false;
      return true;
    });

    renderData(filtered);
  }

  function collectValues(item, prefix) {
    return Object.keys(item)
      .filter(key => key.startsWith(prefix) && item[key])
      .map(key => item[key]);
  }

  function renderData(items) {
    list.innerHTML = "";

    if (!items.length) {
      list.innerHTML = `<li class="no-results">No matching results</li>`;
      return;
    }

    items.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="item-name">${item["Program Name (for Display)"]}</div>
        Organization: ${item["Organization Name"]}<br>
        Audience: ${collectValues(item, "Program Audience").join(", ")}<br>
        Type: ${collectValues(item, "Program Type").join(", ")}<br>
        Duration: ${collectValues(item, "Program Duration").join(", ")}<br>
        <a href="${item.Website}" target="_blank">Visit Website</a>
      `;
      list.appendChild(li);
    });
  }

  // Event listener
  document.addEventListener("change", function(e) {
    if (e.target.matches(".filters input")) {
      applyFilters();
    }
  });
</script>
