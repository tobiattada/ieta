<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkbox Filtered Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
    }

    legend {
      font-weight: bold;
      font-size: 14px;
    }

    label {
      font-size: 14px;
      cursor: pointer;
    }

    #data-list {
      list-style: none;
      padding: 0;
    }

    #data-list li {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
    }

    .no-results {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<h1>Filterable Data</h1>

<div class="filters">

  <fieldset>
    <legend>Name</legend>
    <div id="nameFilter"></div>
  </fieldset>

  <fieldset>
    <legend>Category</legend>
    <div id="categoryFilter"></div>
  </fieldset>

  <fieldset id="priceFilter">
    <legend>Price</legend>
    <label><input type="checkbox" value="0-10"> $0–$10</label><br>
    <label><input type="checkbox" value="10-50"> $10–$50</label><br>
    <label><input type="checkbox" value="50-100"> $50–$100</label><br>
    <label><input type="checkbox" value="100+"> $100+</label>
  </fieldset>

  <fieldset id="ratingFilter">
    <legend>Rating</legend>
    <label><input type="checkbox" value="4"> 4+</label><br>
    <label><input type="checkbox" value="4.5"> 4.5+</label>
  </fieldset>

  <fieldset id="popularityFilter">
    <legend>Popularity</legend>
    <label><input type="checkbox" value="0-200"> 0–200</label><br>
    <label><input type="checkbox" value="200-500"> 200–500</label><br>
    <label><input type="checkbox" value="500+"> 500+</label>
  </fieldset>

</div>

<ul id="data-list"></ul>

<script>
  const data = [
    { name: "Item A", category: "Books", price: 12.99, rating: 4.5, popularity: 230 },
    { name: "Item B", category: "Games", price: 39.99, rating: 4.9, popularity: 510 },
    { name: "Item C", category: "Books", price: 8.5, rating: 4.1, popularity: 120 },
    { name: "Item D", category: "Electronics", price: 199.99, rating: 4.7, popularity: 890 }
  ];

  const list = document.getElementById("data-list");

  function createCheckboxes(containerId, values) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    [...new Set(values)].sort().forEach(value => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" value="${value}"> ${value}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });
  }

  function getCheckedValues(containerId) {
    return [...document.querySelectorAll(`#${containerId} input:checked`)]
      .map(i => i.value);
  }

  function matchesRange(value, range) {
    if (range.endsWith("+")) {
      return value >= Number(range.replace("+", ""));
    }
    const [min, max] = range.split("-").map(Number);
    return value >= min && value <= max;
  }

  function applyFilters() {
    const names = getCheckedValues("nameFilter");
    const categories = getCheckedValues("categoryFilter");
    const prices = getCheckedValues("priceFilter");
    const ratings = getCheckedValues("ratingFilter");
    const popularities = getCheckedValues("popularityFilter");

    const filtered = data.filter(item => {
      if (names.length && !names.includes(item.name)) return false;
      if (categories.length && !categories.includes(item.category)) return false;
      if (prices.length && !prices.some(r => matchesRange(item.price, r))) return false;
      if (ratings.length && !ratings.some(r => item.rating >= Number(r))) return false;
      if (popularities.length && !popularities.some(r => matchesRange(item.popularity, r))) return false;
      return true;
    });

    renderData(filtered);
  }

  function renderData(items) {
    list.innerHTML = "";

    if (!items.length) {
      list.innerHTML = `<li class="no-results">No matching results</li>`;
      return;
    }

    items.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="item-name">${item.name}</div>
        Category: ${item.category}<br>
        Price: $${item.price}<br>
        Rating: ${item.rating}<br>
        Popularity: ${item.popularity}
      `;
      list.appendChild(li);
    });
  }

  // Initialize
  createCheckboxes("nameFilter", data.map(i => i.name));
  createCheckboxes("categoryFilter", data.map(i => i.category));

  document.querySelectorAll(".filters input")
    .forEach(cb => cb.addEventListener("change", applyFilters));

  renderData(data);
</script>

</body>
</html>
