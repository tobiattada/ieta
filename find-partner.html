
<div id="trip-planner-custom-code">

    <div id="openPopup">
      <p>Filters</p><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.83337H13M4.92333 8.00004H11.0767M6.84667 11.1667H9.15333" stroke="#545454" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>


  <div id="popup" class="popup filter-wrapper">
      <div class="popup-content">
        
        <div class="filters">
          <div class="audienceFilter"><h5>Audience</h5><div id="audienceFilter" class="filter"></div></div>
          <div class="demographicFilter"><h5>Demographic</h5><div id="demographicFilter" class="filter"></div></div>
          <div class="durationFilter"><h5>Program Duration</h5><div id="durationFilter" class="filter"></div></div>
          <div class="typeFilter"><h5>Program Type</h5><div id="typeFilter" class="filter"></div></div>
        </div>

        <div class="filter-nav">
          <a class="close-filters button"><p>Apply filters</p></a>
          <button id="clearFiltersBtn">Clear Filters</button>
        </div>
      </div>
  </div>

    <br>
  <p style="text-align:center;">* Eligible for RootOne Vouchers</p>
  <br>


  <ul id="data-list"></ul>

  <button id="loadMoreBtn">Load More</button>
</div>



<script>
let data = [];
const list = document.getElementById("data-list");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const clearFiltersBtn = document.getElementById("clearFiltersBtn");

let itemsToShow = 10; // initial items to show
let currentData = []; // stores filtered data for Load More

// 🔹 Get logo URL
function getLogoUrl(programName) {
  const encodedName = encodeURIComponent(programName); // spaces and special characters
  return `https://raw.githubusercontent.com/tobiattada/ieta/9fb32e1e6dc67f7c50165345630c896d5aaaa64a/logos/${encodedName}/logo.png`;
}

// 🔹 Load JSON from GitHub RAW
fetch("https://raw.githubusercontent.com/tobiattada/ieta/9fb32e1e6dc67f7c50165345630c896d5aaaa64a/trip-platform-org-list.json")
  .then(res => res.json())
  .then(json => {
    data = json;

    // Initial render
    renderData(data);

    // Create filters
    createCheckboxes("audienceFilter", getValues(["Program Audience 1","Program Audience 2","Program Audience 3","Program Audience 4"]));
    createCheckboxes("demographicFilter", getValues(["Program Demographic 1","Program Demographic 2","Program Demographic 3"]));
    createCheckboxes("typeFilter", getValues(["Program Type 1","Program Type 2","Program Type 3"]));
    createCheckboxes("durationFilter", getValues(["Program Duration 1","Program Duration 2","Program Duration 3"]));
  })
  .catch(err => console.error("JSON load error:", err));

// 🔹 Get unique values for filters
function getValues(columns) {
  const values = [];

  data.forEach(item => {
    columns.forEach(col => {
      if (item[col]) values.push(item[col].toString().toLowerCase());
    });
  });

  return [...new Set(values)]
    .sort()
    .map(v => v.charAt(0).toUpperCase() + v.slice(1));
}

// 🔹 Get checked checkbox values
function getCheckedValues(containerId) {
  return [...document.querySelectorAll(`#${containerId} input:checked`)]
    .map(i => i.value.toLowerCase());
}

// 🔹 Create filter checkboxes
function createCheckboxes(containerId, values) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  values.forEach(value => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" value="${value}"> ${value}`;
    container.appendChild(label);
  });

  wrapLabelText();
}

// 🔹 Check if item matches any value in columns
function matchesColumns(item, columns, selectedValues) {
  return selectedValues.some(val =>
    columns.some(col => {
      const itemVal = item[col];
      return itemVal && itemVal.toString().toLowerCase() === val.toString().toLowerCase();
    })
  );
}

// 🔹 Apply filters
function applyFilters() {
  itemsToShow = 10; // reset items to show
  const audiences = getCheckedValues("audienceFilter");
  const demographics = getCheckedValues("demographicFilter");
  const types = getCheckedValues("typeFilter");
  const durations = getCheckedValues("durationFilter");

  const filtered = data.filter(item => {
    if (audiences.length &&
        !matchesColumns(item,
          ["Program Audience 1","Program Audience 2","Program Audience 3","Program Audience 4"],
          audiences)) return false;

    if (demographics.length &&
        !matchesColumns(item,
          ["Program Demographic 1","Program Demographic 2","Program Demographic 3"],
          demographics)) return false;

    if (types.length &&
        !matchesColumns(item,
          ["Program Type 1","Program Type 2","Program Type 3"],
          types)) return false;

    if (durations.length &&
        !matchesColumns(item,
          ["Program Duration 1","Program Duration 2","Program Duration 3"],
          durations)) return false;

    return true;
  });

  renderData(filtered);
}

// 🔹 Render data with Load More support
function renderData(items, reset = true) {
  if (reset) {
    list.innerHTML = "";
    itemsToShow = 10;
    currentData = items;
  }

  const itemsForRender = items.slice(0, itemsToShow);

  if (!itemsForRender.length) {
    list.innerHTML = `<li class="no-results">No matching results</li>`;
    loadMoreBtn.style.display = "none";
    return;
  }

  itemsForRender.forEach(item => {
    const li = document.createElement("li");

    li.innerHTML = `
      <a href="${item.Website}" target="_blank">
        <div class="image-wrap">
          <img src="${getLogoUrl(item["Program Name (for Display)"])}"
               alt="${item["Program Name (for Display)"]}">
        </div>
        <p class="bold">${item["Program Name (for Display)"]}</p>
        <p>${item["Organization Name"]}</p>
      </a>
    `;

    list.appendChild(li);
  });

  wrapLabelText();

  // Show or hide Load More button
  if (itemsToShow >= items.length) {
    loadMoreBtn.style.display = "none";
  } else {
    loadMoreBtn.style.display = "inline-block";
  }
}

// 🔹 Load More button click
loadMoreBtn.addEventListener("click", () => {
  itemsToShow += 10;
  renderData(currentData, false); // append more items
});

// 🔹 Wrap label text before colon in <b> and remove colon
function wrapLabelText() {
  document.querySelectorAll("label").forEach(label => {
    const textNode = Array.from(label.childNodes)
      .find(node => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
    if (!textNode) return;

    const text = textNode.textContent.trim();
    const colonIndex = text.indexOf(":");
    if (colonIndex === -1) return;

    const before = text.slice(0, colonIndex).trim();
    const after = text.slice(colonIndex + 1).trim();

    const bold = document.createElement("b");
    bold.textContent = before;

    textNode.textContent = " " + after;
    label.insertBefore(bold, textNode);
  });
}

// 🔹 Clear Filters button
clearFiltersBtn.addEventListener("click", () => {
  document.querySelectorAll("#audienceFilter input, #demographicFilter input, #typeFilter input, #durationFilter input")
    .forEach(cb => cb.checked = false);

  renderData(data); // reset full data
});

// 🔹 Listen for checkbox changes
document.addEventListener("change", function(e) {
  if (e.target.matches("input[type=checkbox]")) {
    applyFilters();
  }
});
</script>


<script>
const popup = document.getElementById("popup");
const openBtn = document.getElementById("openPopup");
const closeBtn = document.querySelector(".close-filters");

openBtn.addEventListener("click", () => {
  popup.classList.add("active");
  document.body.style.overflow = "hidden"; // prevent background scroll
});

closeBtn.addEventListener("click", closePopup);

popup.addEventListener("click", (e) => {
  if (e.target === popup) closePopup(); // close when clicking outside
});

function closePopup() {
  popup.classList.remove("active");
  document.body.style.overflow = "";
}
</script>


<script>
const accordionItems = document.querySelectorAll(
  ".audienceFilter, .demographicFilter, .durationFilter, .typeFilter"
);

accordionItems.forEach(item => {
  const trigger = item.querySelector("h5");

  trigger.addEventListener("click", () => {

    // Close all other accordions
    accordionItems.forEach(el => {
      if (el !== item) {
        el.classList.remove("open-filter");
      }
    });

    // Toggle current one
    item.classList.toggle("open-filter");

  });
});
</script>
