<script>

let data = [];
let currentData = [];
let itemsToShow = 0;

const list = document.getElementById("data-list");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const clearFiltersBtn = document.getElementById("clearFiltersBtn");

const FILTER_GROUPS = [
  { id: "audienceFilter",    label: "Audience",         cols: ["Program Audience 1","Program Audience 2","Program Audience 3","Program Audience 4"] },
  { id: "demographicFilter", label: "Demographic",      cols: ["Program Demographic 1","Program Demographic 2","Program Demographic 3"] },
  { id: "typeFilter",        label: "Program Type",     cols: ["Program Type 1","Program Type 2","Program Type 3"] },
  { id: "durationFilter",    label: "Program Duration", cols: ["Program Duration 1","Program Duration 2","Program Duration 3"], hardcoded: ["Up to 2 weeks", "3-10 weeks", "Semester/year"] },
];

// 🔹 Get logo URL
function getLogoUrl(name) {
  return `https://raw.githubusercontent.com/tobiattada/ieta/ab24829d543e40ed39ee6905212c868271b52155/logos/${encodeURIComponent(name.replace(/[':]/g, "").replace(/\s+/g, " ").trim())}/logo.png`;
}

// 🔹 Load JSON
fetch("https://raw.githubusercontent.com/tobiattada/ieta/ab24829d543e40ed39ee6905212c868271b52155/trip-platform-org-list.json")
  .then(res => res.json())
  .then(json => {
    data = json;
    FILTER_GROUPS.forEach(g => createCheckboxes(g.id, g.hardcoded ?? getUniqueValues(g.cols)));
    renderData(data);
  })
  .catch(err => console.error("JSON load error:", err));

// 🔹 Get unique sorted values across columns
function getUniqueValues(cols) {
  const skip = new Set(["and", "or", "for", "that"]);
  const toTitleCase = str => str.split(/(\s+|-)/).map((w, i) =>
    /\s+/.test(w) || w === '-' ? w :
    i !== 0 && skip.has(w.toLowerCase()) ? w.toLowerCase() :
    w[0].toUpperCase() + w.slice(1)
  ).join('');

  return [...new Set(data.flatMap(item => cols.map(col => item[col]).filter(Boolean).map(v => v.toString().toLowerCase())))]
    .sort()
    .map(toTitleCase);
}

// 🔹 Create checkboxes
function createCheckboxes(containerId, values) {
  document.getElementById(containerId).innerHTML = values.map(v => {
    const display = v.replace(/(^|[\s-])jew\b/gi, (m, p) => p + 'Jew');
    return `<label><input type="checkbox" value="${v}"> ${display}</label>`;
  }).join('');
  wrapLabelText();
}

// 🔹 Apply filters
function applyFilters() {
  itemsToShow = 0;
  const filtered = data.filter(item =>
    FILTER_GROUPS.every(g => {
      const checked = getCheckedValues(g.id);
      return !checked.length || checked.some(val => g.cols.some(col => item[col]?.toString().toLowerCase() === val));
    })
  );
  renderData(filtered);
}

// 🔹 Render items (reset = full re-render, false = append next batch)
function renderData(items, reset = true) {
  if (reset) { list.innerHTML = ""; itemsToShow = 0; currentData = items; }

  if (!currentData.length) {
    list.innerHTML = `<li class="no-results"><p>No programs found matching your filters.</p><p>Try adjusting your selections or <a href="#" onclick="clearAllFilters(event)">clear all filters</a>.</p></li>`;
    loadMoreBtn.style.display = "none";
    updateClearButtonVisibility();
    return;
  }

  const PARTNERS = [
    { field: "RootOne Partner",              label: "RootOne" },
    { field: "Masa Israel Journey Partner",  label: "Masa Israel Journey" },
    { field: "Taglit-Birthright Partner",    label: "Taglit-Birthright" },
  ];

  // 🔹 Build partner badges HTML
  function getPartnerBadges(item) {
    const badges = PARTNERS
      .filter(p => item[p.field]?.toString().toUpperCase() === "TRUE")
      .map(p => `
        <div class="partner-badge">
          <img src="https://cdn.fedweb.org/fed-42/2/fontisto_plane-ticket.png" alt="partner icon">
          <span>${p.label}</span>
        </div>`)
      .join('');
    return badges ? `<div class="partner-badges">${badges}</div>` : '';
  }

  currentData.slice(itemsToShow, itemsToShow + 10).forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `
      <a href="${item.Website}" target="_blank">
        <div class="image-wrap">
          <img src="${getLogoUrl(item["Program Name (for Display)"])}" alt="${item["Program Name (for Display)"]}">
        </div>
        <p class="bold">${item["Program Name (for Display)"]}</p>
        <p>${item["Organization Name"]}</p>
        ${getPartnerBadges(item)}
      </a>`;
    list.appendChild(li);
  });

  itemsToShow += Math.min(10, currentData.length - itemsToShow);
  wrapLabelText();

  const done = itemsToShow >= currentData.length;
  loadMoreBtn.textContent = done ? "Back to Top" : "Load More";
  loadMoreBtn.classList.toggle("backtotop", done);
  loadMoreBtn.style.display = "inline-block";
}

// 🔹 Wrap label text before colon in <b>
function wrapLabelText() {
  document.querySelectorAll("label").forEach(label => {
    const textNode = [...label.childNodes].find(n => n.nodeType === Node.TEXT_NODE && n.textContent.trim());
    if (!textNode) return;
    const [before, ...rest] = textNode.textContent.trim().split(":");
    if (!rest.length) return;
    const b = Object.assign(document.createElement("b"), { textContent: before.trim() });
    const span = Object.assign(document.createElement("span"), { textContent: " " + rest.join(":").trim() });
    label.replaceChild(span, textNode);
    label.insertBefore(b, span);
  });
}

// 🔹 Helpers
function getCheckedValues(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value.toLowerCase());
}

function updateClearButtonVisibility() {
  clearFiltersBtn.style.display = FILTER_GROUPS.some(g => getCheckedValues(g.id).length) ? "flex" : "none";
}

function updateFilterCounts() {
  FILTER_GROUPS.forEach(g => {
    const heading = document.querySelector(`.${g.id} h5`);
    if (!heading) return;
    const count = getCheckedValues(g.id).length;
    heading.textContent = count ? `${g.label} (${count})` : g.label;
  });
}

function clearAllFilters(event) {
  event?.preventDefault();
  document.querySelectorAll(FILTER_GROUPS.map(g => `#${g.id} input`).join(", ")).forEach(cb => cb.checked = false);
  itemsToShow = 0;
  renderData(data);
  updateClearButtonVisibility();
  updateFilterCounts();
}

// 🔹 Events
loadMoreBtn.addEventListener("click", () => {
  itemsToShow < currentData.length
    ? renderData(currentData, false)
    : document.getElementById("trip-planner-custom-code")?.scrollIntoView({ behavior: "smooth" });
});

clearFiltersBtn.addEventListener("click", clearAllFilters);

document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox]")) {
    applyFilters();
    updateClearButtonVisibility();
    updateFilterCounts();
  }
});

</script>
















<script>
const popup = document.getElementById("popup");
const openBtn = document.getElementById("openPopup");
const closeBtns = document.querySelectorAll(".close-filters");

openBtn.addEventListener("click", () => {
  popup.classList.add("active");
  document.body.style.overflow = "hidden"; // prevent background scroll
});

closeBtns.forEach(btn => btn.addEventListener("click", closePopup));

popup.addEventListener("click", (e) => {
  if (e.target === popup) closePopup(); // close when clicking outside
});

function closePopup() {
  popup.classList.remove("active");
  document.body.style.overflow = "";
}
</script>

<script>
const accordionItems = document.querySelectorAll(
  ".audienceFilter, .demographicFilter, .durationFilter, .typeFilter"
);

accordionItems.forEach(item => {
  const trigger = item.querySelector("h5");

  trigger.addEventListener("click", () => {

    // Close all other accordions
    accordionItems.forEach(el => {
      if (el !== item) {
        el.classList.remove("open-filter");
      }
    });

    // Toggle current one
    item.classList.toggle("open-filter");

  });
});
</script>
